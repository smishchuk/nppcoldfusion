name: Build nppColdFusion Plugin

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.9.1)'
        required: false
        type: string

permissions:
  contents: write
  packages: write

env:
  SOLUTION_FILE: vs.proj/nppColdFusion.sln
  CONFIGURATION: Release

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Generate autocomplete data from YAML
        run: python scripts/generate_autocomplete.py

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
        with:
          nuget-version: '6.x'

      - name: Restore NuGet packages
        run: nuget restore "${{ env.SOLUTION_FILE }}"

      - name: Build with MSBuild (x64)
        run: |
          msbuild "${{ env.SOLUTION_FILE }}" `
            /p:Configuration="${{ env.CONFIGURATION }}" `
            /p:Platform="x64" `
            /p:PlatformToolset=v143 `
            /p:WindowsTargetPlatformVersion=10.0 `
            /verbosity:minimal `
            /maxcpucount

      - name: Verify build outputs (x64)
        run: |
          $dllPath = "vs.proj\\x64\\Unicode ${{ env.CONFIGURATION }}\\nppColdFusion.dll"
          $xmlPath = "src\\nppColdFusion.xml"
          $db3Path = "src\\nppColdFusion.db3"

          if (-not (Test-Path $dllPath)) { Write-Error "DLL not found at $dllPath"; exit 1 }
          if (-not (Test-Path $xmlPath)) { Write-Error "XML not found at $xmlPath"; exit 1 }
          if (-not (Test-Path $db3Path)) { Write-Error "DB3 not found at $db3Path"; exit 1 }

          Write-Host "All artifacts found"

      - name: Prepare release artifacts (x64)
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}"
          if ($version -notmatch '^v\d+\.\d+\.\d+') {
            $version = "v$(git describe --tags --always --dirty)"
          }
          $artifactDir = "dist\\${version}\\x64"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          Copy-Item "vs.proj\\x64\\Unicode ${{ env.CONFIGURATION }}\\nppColdFusion.dll" "$artifactDir\\nppColdFusion.dll"
          Copy-Item "src\\nppColdFusion.xml" "$artifactDir\\nppColdFusion.xml"
          Copy-Item "src\\nppColdFusion.db3" "$artifactDir\\nppColdFusion.db3"

          $installText = "nppColdFusion $version - Installation Instructions`n====================================================`n`n1. Create folder: %ProgramFiles%\\Notepad++\\plugins\\nppColdFusion\\`n2. Copy nppColdFusion.dll to that folder`n3. Copy nppColdFusion.xml and nppColdFusion.db3 to:`n   %AppData%\\Notepad++\\plugins\\config\\`n`nFor Portable Notepad++:`n  Copy nppColdFusion.dll to <Notepad++>\\plugins\\nppColdFusion\\`n  Copy nppColdFusion.xml and nppColdFusion.db3 to <Notepad++>\\plugins\\config\\"
          Set-Content "$artifactDir\\INSTALL.txt" -Encoding UTF8 -Value $installText

          # SHA256SUMS.txt (required for Plugin Admin)
          $sha256 = @()
          $sha256 += "nppColdFusion.dll $(Get-FileHash -Algorithm SHA256 "$artifactDir\\nppColdFusion.dll" | Select-Object -ExpandProperty Hash -First 1)"
          $sha256 += "nppColdFusion.xml $(Get-FileHash -Algorithm SHA256 "$artifactDir\\nppColdFusion.xml" | Select-Object -ExpandProperty Hash -First 1)"
          $sha256 += "nppColdFusion.db3 $(Get-FileHash -Algorithm SHA256 "$artifactDir\\nppColdFusion.db3" | Select-Object -ExpandProperty Hash -First 1)"
          Set-Content "$artifactDir\\SHA256SUMS.txt" -Encoding UTF8 -Value ($sha256 -join "`n")

          Write-Host "x64 artifacts prepared in $artifactDir"
          Get-ChildItem $artifactDir

      - name: Upload x64 build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nppColdFusion-x64-${{ env.CONFIGURATION }}
          path: dist/**/*
          retention-days: 30

  build-win32:
    name: Build Windows x86 (Win32)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Generate autocomplete data from YAML
        run: python scripts/generate_autocomplete.py

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
        with:
          nuget-version: '6.x'

      - name: Restore NuGet packages
        run: nuget restore "${{ env.SOLUTION_FILE }}"

      - name: Build Win32 (solution platform x86 maps to project Unicode Release|Win32)
        run: |
          msbuild "${{ env.SOLUTION_FILE }}" `
            /p:Configuration="${{ env.CONFIGURATION }}" `
            /p:Platform="x86" `
            /p:PlatformToolset=v143 `
            /p:WindowsTargetPlatformVersion=10.0 `
            /verbosity:minimal `
            /maxcpucount

      - name: Verify Win32 build outputs
        run: |
          $dllPath = "vs.proj\\Win32\\Unicode Release\\nppColdFusion.dll"
          $xmlPath = "src\\nppColdFusion.xml"
          $db3Path = "src\\nppColdFusion.db3"

          if (-not (Test-Path $dllPath)) { Write-Error "DLL not found at $dllPath"; exit 1 }
          if (-not (Test-Path $xmlPath)) { Write-Error "XML not found at $xmlPath"; exit 1 }
          if (-not (Test-Path $db3Path)) { Write-Error "DB3 not found at $db3Path"; exit 1 }

          Write-Host "All Win32 artifacts found"

      - name: Prepare release artifacts (Win32)
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}"
          if ($version -notmatch '^v\d+\.\d+\.\d+') {
            $version = "v$(git describe --tags --always --dirty)"
          }
          $artifactDir = "dist\\${version}\\win32"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          Copy-Item "vs.proj\\Win32\\Unicode Release\\nppColdFusion.dll" "$artifactDir\\nppColdFusion.dll"
          Copy-Item "src\\nppColdFusion.xml" "$artifactDir\\nppColdFusion.xml"
          Copy-Item "src\\nppColdFusion.db3" "$artifactDir\\nppColdFusion.db3"

          $installText = "nppColdFusion $version - Installation Instructions`n====================================================`n`n1. Create folder: %ProgramFiles%\\Notepad++\\plugins\\nppColdFusion\\`n2. Copy nppColdFusion.dll to that folder`n3. Copy nppColdFusion.xml and nppColdFusion.db3 to:`n   %AppData%\\Notepad++\\plugins\\config\\`n`nFor Portable Notepad++:`n  Copy nppColdFusion.dll to <Notepad++>\\plugins\\nppColdFusion\\`n  Copy nppColdFusion.xml and nppColdFusion.db3 to <Notepad++>\\plugins\\config\\"
          Set-Content "$artifactDir\\INSTALL.txt" -Encoding UTF8 -Value $installText

          # SHA256SUMS.txt (required for Plugin Admin)
          $sha256 = @()
          $sha256 += "nppColdFusion.dll $(Get-FileHash -Algorithm SHA256 "$artifactDir\\nppColdFusion.dll" | Select-Object -ExpandProperty Hash -First 1)"
          $sha256 += "nppColdFusion.xml $(Get-FileHash -Algorithm SHA256 "$artifactDir\\nppColdFusion.xml" | Select-Object -ExpandProperty Hash -First 1)"
          $sha256 += "nppColdFusion.db3 $(Get-FileHash -Algorithm SHA256 "$artifactDir\\nppColdFusion.db3" | Select-Object -ExpandProperty Hash -First 1)"
          Set-Content "$artifactDir\\SHA256SUMS.txt" -Encoding UTF8 -Value ($sha256 -join "`n")

          Write-Host "Win32 artifacts prepared in $artifactDir"
          Get-ChildItem $artifactDir

      - name: Upload Win32 build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nppColdFusion-Win32-${{ env.CONFIGURATION }}
          path: dist/**/*
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-win32]
    permissions:
      contents: write

    steps:
      - name: Download x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: nppColdFusion-x64-Release
          path: dist/${{ github.ref_name }}/x64

      - name: Download Win32 artifacts
        uses: actions/download-artifact@v4
        with:
          name: nppColdFusion-Win32-Release
          path: dist/${{ github.ref_name }}/win32

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: nppColdFusion ${{ github.ref_name }}
          body: |
            ## nppColdFusion ${{ github.ref_name }}

            **Notepad++ ColdFusion/CFML Lexer Plugin** for x64 and x86 (Notepad++ 8+)

            ### Installation
            1. Download the appropriate architecture assets below
            2. See `INSTALL.txt` in each architecture folder for detailed instructions

            ### Changes
            See [CHANGELOG.md](https://github.com/smishchuk/nppcoldfusion/blob/master/CHANGELOG.md)
          draft: false
          prerelease: false
          files: |
            dist/${{ github.ref_name }}/x64/nppColdFusion.dll
            dist/${{ github.ref_name }}/x64/nppColdFusion.xml
            dist/${{ github.ref_name }}/x64/nppColdFusion.db3
            dist/${{ github.ref_name }}/x64/INSTALL.txt
            dist/${{ github.ref_name }}/x64/SHA256SUMS.txt
            dist/${{ github.ref_name }}/win32/nppColdFusion.dll
            dist/${{ github.ref_name }}/win32/nppColdFusion.xml
            dist/${{ github.ref_name }}/win32/nppColdFusion.db3
            dist/${{ github.ref_name }}/win32/INSTALL.txt
            dist/${{ github.ref_name }}/win32/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}